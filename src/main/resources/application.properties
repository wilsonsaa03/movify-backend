# ─────────────────────────────────────────────────────────────
#  MoviFY backend — configuración SIN secretos.
#  Los secretos llegan por variables de entorno (en el VPS: /etc/movify/movify.env,
#  cargado por systemd con EnvironmentFile). Ver DEPLOY.md.
# ─────────────────────────────────────────────────────────────
server.port=8080

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/movify_db?connectTimeout=10}
spring.datasource.username=${DB_USER:dev_movify}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# El esquema lo maneja Flyway (src/main/resources/db/migration). V3 = modelo DER v2.3.
# Sin ORM: todo el acceso a datos es con JdbcTemplate.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT (mínimo 32 caracteres; generar con: openssl rand -base64 48)
# El access token dura 24 h por defecto (la web no renueva); la app usa además el refresh token (30 días)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# SMS con Twilio (códigos de verificación). Sin estas variables no se pueden enviar códigos.
#   TWILIO_ACCOUNT_SID  (AC...)            obligatorio
#   TWILIO_AUTH_TOKEN   o TWILIO_API_KEY + TWILIO_API_SECRET
#   TWILIO_FROM (+1...) o TWILIO_MESSAGING_SERVICE_SID (MG...)
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.api-key=${TWILIO_API_KEY:}
app.sms.twilio.api-secret=${TWILIO_API_SECRET:}
app.sms.twilio.from=${TWILIO_FROM:}
app.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
# SOLO desarrollo: escribe el código en la consola y lo devuelve en la respuesta. En producción: false.
app.sms.consola=${SMS_CONSOLA:false}


# Registro de administradores: sin código configurado queda cerrado
app.admin.secret-code=${ADMIN_SECRET_CODE:}

# Google Sign-In (client id público del frontend; se usa para validar el id_token)
app.google.client-id=${GOOGLE_CLIENT_ID:613651963678-99u5b1boql9q6fj65l0kairjh8ptdk4h.apps.googleusercontent.com}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://movify.ds2.eleueleo.com}

# Correo (contraseña de aplicación de Gmail por variable de entorno)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:movify2.app@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=${FRONTEND_URL:https://movify.ds2.eleueleo.com}
app.zona-horaria=America/Bogota
app.documentos.dir=${DOCUMENTOS_DIR:/var/www/ds2/movify/uploads-conductores}

# Simulación de viajes: SOLO para demos (ver SimulacionDemo). En producción siempre false.
app.demo.simulacion=${DEMO_SIMULACION:false}

# Tareas programadas (expirar solicitudes, suspender documentos vencidos, purgar datos)
app.tareas.habilitadas=${TAREAS_HABILITADAS:true}

# Rutas y tiempos (OSRM público; si falla se usa línea recta × 1.3)
app.osrm.url=${OSRM_URL:https://router.project-osrm.org}

# Archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Logging
logging.level.root=WARN
logging.level.com.movify=INFO
logging.level.org.springframework.security=WARN

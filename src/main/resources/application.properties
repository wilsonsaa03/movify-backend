# ─────────────────────────────────────────────────────────────
#  MoviFY backend — configuración SIN secretos.
#  Los secretos llegan por variables de entorno (en el VPS: /etc/movify/movify.env,
#  cargado por systemd con EnvironmentFile). Ver DEPLOY.md.
# ─────────────────────────────────────────────────────────────
server.port=8080

# Base de datos
# Por defecto: la base de datos del deploy (nombre interno de la red Docker). La contraseña va en DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://movify-db-unmfpe:5432/movify_db?connectTimeout=10}
spring.datasource.username=${DB_USER:movify}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# El esquema lo maneja Flyway (src/main/resources/db/migration). V3 = modelo DER v2.3.
# Sin ORM: todo el acceso a datos es con JdbcTemplate.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT (mínimo 32 caracteres; generar con: openssl rand -base64 48)
# El access token dura 24 h por defecto (la web no renueva); la app usa además el refresh token (30 días)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# SMS con Twilio (códigos de verificación). Sin estas variables no se pueden enviar códigos.
#   TWILIO_ACCOUNT_SID  (AC...)            obligatorio
#   TWILIO_AUTH_TOKEN   o TWILIO_API_KEY + TWILIO_API_SECRET
#   TWILIO_FROM (+1...) o TWILIO_MESSAGING_SERVICE_SID (MG...)
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.api-key=${TWILIO_API_KEY:}
app.sms.twilio.api-secret=${TWILIO_API_SECRET:}
app.sms.twilio.from=${TWILIO_FROM:}
app.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
# SOLO desarrollo: escribe el código en la consola y lo devuelve en la respuesta. En producción: false.
# También simula las llamadas con número protegido cuando no hay Twilio Voice.
app.sms.consola=${SMS_CONSOLA:false}

# Llamadas con número protegido (Twilio Voice). Usa las mismas credenciales TWILIO_* del SMS.
# Número de Twilio con voz habilitada (+1... o +57...). Si se deja vacío se usa TWILIO_FROM.
app.llamadas.twilio.numero=${TWILIO_NUMERO_VOZ:}

# Pagos digitales (Nequi y Daviplata). PAGOS_MODO: apagado (solo efectivo) | simulado (solo local) | wompi.
# Wompi: por defecto el SANDBOX (no mueve plata real). Llaves en el panel de Wompi → Desarrolladores.
app.pagos.modo=${PAGOS_MODO:apagado}
app.pagos.wompi.url=${WOMPI_URL:https://sandbox.wompi.co/v1}
app.pagos.wompi.llave-publica=${WOMPI_LLAVE_PUBLICA:}
app.pagos.wompi.secreto-integridad=${WOMPI_SECRETO_INTEGRIDAD:}
# Wompi pide un correo del cliente; si la cuenta no tiene correo se usa este
app.pagos.correo-por-defecto=${PAGOS_CORREO:pagos@movify.co}


# Notificaciones push (Firebase Cloud Messaging). Ruta al JSON de la cuenta de servicio de Firebase
# (Configuración del proyecto → Cuentas de servicio → Generar nueva clave privada). Fuera del repo.
# Sin esta variable los avisos se guardan en la tabla notificaciones y solo se escriben en el log.
app.push.fcm.credenciales=${FCM_CREDENCIALES:}

# Registro de administradores: sin código configurado queda cerrado
app.admin.secret-code=${ADMIN_SECRET_CODE:}

# Google Sign-In (client id público del frontend; se usa para validar el id_token)
app.google.client-id=${GOOGLE_CLIENT_ID:613651963678-99u5b1boql9q6fj65l0kairjh8ptdk4h.apps.googleusercontent.com}

# CORS: la web y la app instalada (Capacitor: https://localhost en Android, capacitor://localhost en iPhone,
# http://localhost en el APK de pruebas). Los orígenes de desarrollo van en application-local.properties.
app.cors.allowed-origins=${CORS_ORIGINS:https://movify.ds2.eleueleo.com,https://localhost,capacitor://localhost,http://localhost}

# ─── Seguridad ───
# "produccion" activa la revisión de arranque (ProduccionSegura): no arranca con modos de prueba o claves filtradas.
app.entorno=${APP_ENTORNO:desarrollo}
# Límite de peticiones por IP/sesión (LimitePeticionesFiltro). Solo se apaga en las pruebas automáticas.
app.limites.habilitados=${LIMITES_HABILITADOS:true}
# Nunca modo debug ni detalles internos en las respuestas de error
debug=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.main.banner-mode=off
# Sin el usuario "user" con clave aleatoria que Spring Boot crea por defecto (la autenticación es solo JWT)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Correo (contraseña de aplicación de Gmail por variable de entorno)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:movify2.app@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=${FRONTEND_URL:https://movify.ds2.eleueleo.com}
app.zona-horaria=America/Bogota
app.documentos.dir=${DOCUMENTOS_DIR:/var/www/ds2/movify/uploads-conductores}

# Simulación de viajes: SOLO para demos (ver SimulacionDemo). En producción siempre false.
app.demo.simulacion=${DEMO_SIMULACION:false}

# Simulación de viajes por las calles (SimulacionViajes): el vehículo sigue la ruta OSRM, no el GPS del celular.
# true = TODOS los viajes se simulan (pruebas y sustentación). En producción siempre false (ProduccionSegura).
app.simulacion.viajes=${SIMULACION_VIAJES:false}
# El vehículo arranca solo al aceptar (false = espera a que el conductor toque "Iniciar")
app.simulacion.auto-iniciar=${SIMULACION_AUTO_INICIAR:true}
# Velocidad realista: con ella se calcula el tiempo que muestra la app ("6 min", "Llegas a las…")
app.simulacion.velocidad-moto-kmh=32
app.simulacion.velocidad-taxi-kmh=28
# Tope de duración de cada tramo simulado (recogida y viaje), en segundos: el vehículo va más rápido por la
# MISMA ruta para no esperar en las pruebas, pero la pantalla sigue mostrando el tiempo realista. 0 = sin tope.
app.simulacion.max-segundos=${SIMULACION_MAX_SEGUNDOS:60}
# Perfil OSRM por vehículo. El OSRM público solo tiene "driving"; con un OSRM propio se puede usar uno de moto.
app.simulacion.perfil-taxi=driving
app.simulacion.perfil-moto=${SIMULACION_PERFIL_MOTO:driving}
app.simulacion.osrm-url-moto=${SIMULACION_OSRM_MOTO:}

# Tareas programadas (expirar solicitudes, suspender documentos vencidos, purgar datos)
app.tareas.habilitadas=${TAREAS_HABILITADAS:true}

# Rutas y tiempos (OSRM público; si falla se usa línea recta × 1.3)
app.osrm.url=${OSRM_URL:https://router.project-osrm.org}

# Archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Logging
logging.level.root=WARN
logging.level.com.movify=INFO
logging.level.org.springframework.security=WARN

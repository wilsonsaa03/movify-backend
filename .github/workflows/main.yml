name: 🚀 Backend MoviFY

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Compila y corre las pruebas en cada PR y en cada push
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    # PostgreSQL real para la prueba de punta a punta (migraciones V1–V4 y triggers del DER v2.3)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev_movify
          POSTGRES_PASSWORD: clave_de_pruebas
          POSTGRES_DB: movify_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev_movify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar + pruebas
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee build.log
        env:
          MOVIFY_IT: 'true'
          DB_URL: jdbc:postgresql://localhost:5432/movify_pruebas
          DB_USER: dev_movify
          DB_PASSWORD: clave_de_pruebas
          TZ: America/Bogota

      # Si falla, deja los errores visibles en la pestaña "Checks" del PR (sin descargar logs)
      - name: Resumen de errores
        if: failure()
        run: |
          grep -E '^\[ERROR\]' build.log | grep -vE 'Re-run Maven|Help 1|^\[ERROR\] *$|-> \[Help' | head -60 > errores.txt || true
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -qE 'FAILURE|ERROR' "$f" && head -40 "$f" >> errores.txt
          done
          i=0
          while mapfile -t -n 15 bloque && ((${#bloque[@]})); do
            i=$((i+1)); texto=$(printf '%s%%0A' "${bloque[@]}")
            echo "::error title=Errores ($i)::${texto}"
            [ $i -ge 9 ] && break
          done < errores.txt
          cat errores.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # Solo despliega lo que ya compiló y pasó pruebas. Dokploy construye la imagen con el Dockerfile del repo.
  # Secrets del repo (Settings → Secrets and variables → Actions):
  #   DOKPLOY_URL             p. ej. https://dokploy.midominio.com  (sin / al final)
  #   DOKPLOY_API_KEY         Dokploy → Settings → Profile → API/CLI → Generate token
  #   DOKPLOY_APPLICATION_ID  el id de la app del backend (aparece en la URL de la app en Dokploy)
  # En Dokploy, apaga "Autodeploy" de la app para que no despliegue antes de que pasen las pruebas.
  deploy:
    name: Desplegar en Dokploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el deploy a Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -e
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::error::Faltan los secrets DOKPLOY_URL, DOKPLOY_API_KEY o DOKPLOY_APPLICATION_ID"
            exit 1
          fi
          codigo=$(curl -sS -o respuesta.txt -w '%{http_code}' -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}")
          echo "Dokploy respondió $codigo"
          if [ "$codigo" -ge 300 ]; then
            cat respuesta.txt
            exit 1
          fi
          echo "Deploy en marcha: míralo en Dokploy → app del backend → Deployments"

name: 🚀 Backend MoviFY

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Compila y corre las pruebas en cada PR y en cada push
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    # PostgreSQL real para la prueba de punta a punta (migraciones V1–V4 y triggers del DER v2.3)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev_movify
          POSTGRES_PASSWORD: clave_de_pruebas
          POSTGRES_DB: movify_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev_movify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar + pruebas
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee build.log
        env:
          MOVIFY_IT: 'true'
          DB_URL: jdbc:postgresql://localhost:5432/movify_pruebas
          DB_USER: dev_movify
          DB_PASSWORD: clave_de_pruebas
          TZ: America/Bogota

      # Si falla, deja los errores visibles en la pestaña "Checks" del PR (sin descargar logs)
      - name: Resumen de errores
        if: failure()
        run: |
          grep -E '^\[ERROR\]' build.log | grep -vE 'Re-run Maven|Help 1|^\[ERROR\] *$|-> \[Help' | head -60 > errores.txt || true
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -qE 'FAILURE|ERROR' "$f" && head -40 "$f" >> errores.txt
          done
          i=0
          while mapfile -t -n 15 bloque && ((${#bloque[@]})); do
            i=$((i+1)); texto=$(printf '%s%%0A' "${bloque[@]}")
            echo "::error title=Errores ($i)::${texto}"
            [ $i -ge 9 ] && break
          done < errores.txt
          cat errores.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # Solo despliega lo que ya compiló y pasó pruebas (el VPS no necesita git, Maven ni token de GitHub)
  deploy:
    name: Desplegar en el VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Preparar jar
        run: |
          JAR=$(ls dist/*.jar | grep -v plain | head -1)
          mkdir -p subir && cp "$JAR" subir/app-new.jar

      - name: Subir jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: subir/app-new.jar
          target: /var/www/ds2/movify-api
          strip_components: 1

      - name: Configurar secretos y reiniciar
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ADMIN_SECRET_CODE: ${{ secrets.ADMIN_SECRET_CODE }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DB_PASSWORD,JWT_SECRET,MAIL_PASSWORD,ADMIN_SECRET_CODE,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_FROM,TWILIO_MESSAGING_SERVICE_SID
          command_timeout: 10m
          script: |
            set -e
            APP=/var/www/ds2/movify-api

            # 1) Secretos fuera del repo: archivo legible solo por root, cargado por systemd
            sudo mkdir -p /etc/movify
            umask 077
            {
              printf 'DB_PASSWORD=%s\n'       "$DB_PASSWORD"
              printf 'JWT_SECRET=%s\n'        "$JWT_SECRET"
              printf 'MAIL_PASSWORD=%s\n'     "$MAIL_PASSWORD"
              printf 'ADMIN_SECRET_CODE=%s\n' "$ADMIN_SECRET_CODE"
              printf 'TWILIO_ACCOUNT_SID=%s\n'  "$TWILIO_ACCOUNT_SID"
              printf 'TWILIO_AUTH_TOKEN=%s\n'   "$TWILIO_AUTH_TOKEN"
              printf 'TWILIO_FROM=%s\n'         "$TWILIO_FROM"
              printf 'TWILIO_MESSAGING_SERVICE_SID=%s\n' "$TWILIO_MESSAGING_SERVICE_SID"
              printf 'DEMO_SIMULACION=false\n'
            } | sudo tee /etc/movify/movify.env > /dev/null
            sudo chmod 600 /etc/movify/movify.env

            sudo mkdir -p /etc/systemd/system/movify.service.d
            printf '[Service]\nEnvironmentFile=/etc/movify/movify.env\n' \
              | sudo tee /etc/systemd/system/movify.service.d/env.conf > /dev/null
            sudo systemctl daemon-reload

            # 2) Limpiar el token de GitHub que dejó el deploy anterior en .git/config
            if [ -d "$APP/.git" ]; then
              git -C "$APP" remote set-url origin https://github.com/wilsonsaa03/movify-backend.git || true
            fi

            # 3) Cambiar el jar guardando el anterior para poder volver atrás
            cd "$APP"
            [ -f app.jar ] && cp app.jar app-prev.jar
            mv app-new.jar app.jar
            sudo systemctl restart movify

            # 4) Healthcheck; si falla, se restaura la versión anterior
            for i in $(seq 1 20); do
              sleep 3
              if curl -fs http://localhost:8080/api/test/ping > /dev/null; then
                echo "Backend arriba"; exit 0
              fi
              echo "Esperando backend ($i/20)..."
            done
            echo "El backend no respondió; restaurando versión anterior"
            sudo journalctl -u movify -n 80 --no-pager || true
            if [ -f app-prev.jar ]; then
              mv app-prev.jar app.jar && sudo systemctl restart movify
            fi
            exit 1
